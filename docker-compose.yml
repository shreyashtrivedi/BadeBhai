name: badebhai

# Completely free, self-hosted stack. One command: `docker compose up --build`, then open
# http://localhost:8000. On an NVIDIA GPU machine add the GPU override for much faster answers:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
# First start pulls the local LLM (OLLAMA_MODEL, ~2.5 GB) and indexes the demo repo
# (psf/requests @ v2.32.3).

x-app: &app
  image: badebhai:latest
  pull_policy: never  # built once by the `api` service
  env_file:
    - path: .env
      required: false
  environment: &app-env
    DATABASE_URL: postgresql://badebhai:badebhai@db:5432/badebhai
    DATA_DIR: /data
    MCP_TRANSPORT: http
    MCP_CODE_SEARCH_URL: http://mcp-code:8101/mcp
    MCP_GIT_HISTORY_URL: http://mcp-git:8102/mcp
    MCP_DOCS_URL: http://mcp-docs:8103/mcp
    LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct}
    OLLAMA_FAST_MODEL: ${OLLAMA_FAST_MODEL:-}
    LOG_JSON: "true"
  volumes:
    - repos:/data
  restart: unless-stopped

x-mcp-health: &mcp-health
  interval: 5s
  timeout: 3s
  retries: 30

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: badebhai
      POSTGRES_PASSWORD: badebhai
      POSTGRES_DB: badebhai
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U badebhai -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Local LLM server (free, open models). Port published so `uv run badebhai ...` on the host can use it.
  ollama:
    image: ollama/ollama:0.40.18
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0  # halves KV-cache memory so longer contexts fit small GPUs
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # One-shot: download the configured model(s) into the ollama volume (skipped quickly if present).
  ollama-pull:
    image: ollama/ollama:0.40.18
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODELS: ${OLLAMA_MODEL:-qwen3:4b-instruct} ${OLLAMA_FAST_MODEL:-}
    entrypoint: ["/bin/sh", "-c", "for m in $$MODELS; do echo pulling $$m; ollama pull $$m || exit 1; done"]
    depends_on:
      ollama: { condition: service_healthy }
    restart: "no"

  mcp-code:
    <<: *app
    command: ["python", "-m", "badebhai.mcp_servers.code_search", "--host", "0.0.0.0", "--port", "8101"]
    ports:
      - "127.0.0.1:8101:8101"  # localhost only: lets editors (Claude Code, Cursor, VS Code) use it
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      <<: *mcp-health
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8101), 2)"]

  mcp-git:
    <<: *app
    command: ["python", "-m", "badebhai.mcp_servers.git_history", "--host", "0.0.0.0", "--port", "8102"]
    ports:
      - "127.0.0.1:8102:8102"  # localhost only: lets editors (Claude Code, Cursor, VS Code) use it
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      <<: *mcp-health
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8102), 2)"]

  mcp-docs:
    <<: *app
    command: ["python", "-m", "badebhai.mcp_servers.docs", "--host", "0.0.0.0", "--port", "8103"]
    ports:
      - "127.0.0.1:8103:8103"  # localhost only: lets editors (Claude Code, Cursor, VS Code) use it
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      <<: *mcp-health
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8103), 2)"]

  api:
    <<: *app
    build: .
    pull_policy: build
    command: ["badebhai", "serve", "--host", "0.0.0.0", "--port", "8000", "--no-mcp"]
    environment:
      <<: *app-env
      AUTO_INGEST_REPO: ${AUTO_INGEST_REPO:-psf/requests@v2.32.3}
    ports:
      - "8000:8000"
    depends_on:
      db: { condition: service_healthy }
      mcp-code: { condition: service_healthy }
      mcp-git: { condition: service_healthy }
      mcp-docs: { condition: service_healthy }
      ollama-pull: { condition: service_completed_successfully }

volumes:
  pgdata:
  repos:
  ollama:
