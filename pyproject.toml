[project]
name = "badebhai"
version = "0.1.0"
description = "BadeBhai: a free, self-hosted agentic RAG assistant over a live GitHub codebase, with memory."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pgvector>=0.3",
    "langgraph>=0.6",
    "langgraph-checkpoint-postgres>=2.0",
    "langsmith>=0.3",
    "mcp>=1.12",
    "httpx>=0.27",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-rust>=0.23",
    "pathspec>=0.12",
    "typer>=0.12",
    "pyyaml>=6.0",
    "fastembed>=0.4",
]

[project.optional-dependencies]
# Optional paid provider. The default stack (Ollama + local embeddings) needs no API keys.
anthropic = ["anthropic>=1.0"]

[project.scripts]
badebhai = "badebhai.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["badebhai"]

# CPU-only torch everywhere except macOS (PyPI's macOS wheels are already CPU/MPS).
# Keeps the Docker image ~1 GB instead of pulling CUDA libraries.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003", "SIM108", "RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db: needs a running Postgres+pgvector (TEST_DATABASE_URL or docker compose)",
    "live: hits real external APIs (Anthropic / GitHub); opt-in with RUN_LIVE=1",
    "network: needs internet access (cloning a public repo)",
]
filterwarnings = ["ignore::DeprecationWarning"]
