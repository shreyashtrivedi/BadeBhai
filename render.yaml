# Render Blueprint for the public BadeBhai demo (free web service).
# Render: New -> Blueprint -> pick this repository. It asks for the values marked `sync: false`.
# Everything heavy is offloaded to free services, so the 512 MB free instance only serves requests:
#   * database: Neon free Postgres with pgvector (DATABASE_URL)
#   * model: Google Gemini free tier through its OpenAI-compatible API (OPENAI_API_KEY); a retired
#     LLM_MODEL is replaced automatically, and a busy one by OPENAI_FALLBACK_MODELS
#   * embeddings: bge-small via ONNX (fastembed) on the instance itself
# The demo repositories are indexed into Neon from a laptop (scripts/index_into_neon.sh): embedding
# them here runs the instance out of memory. On start only their git clones are restored. See docs/deploy.md.
services:
  - type: web
    name: badebhai
    runtime: python
    plan: free
    buildCommand: pip install uv==0.13.10 && uv sync --frozen --no-dev
    startCommand: uv run --no-sync badebhai serve --host 0.0.0.0 --port $PORT --no-mcp
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL # Neon connection string (postgresql://...?sslmode=require)
        sync: false
      - key: OPENAI_API_KEY # Gemini API key from aistudio.google.com/apikey
        sync: false
      - key: GITHUB_TOKEN # optional: read-only token for live GitHub issue search
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_MODEL # gemini-2.5-flash is deprecated and constantly "high demand" on the free tier
        value: gemini-3-flash-preview
      - key: OPENAI_FALLBACK_MODELS # answer with these, in order, while a model is overloaded / out of quota
        value: gemini-3.5-flash-lite,gemini-flash-lite-latest,gemini-3.1-flash-lite
      - key: OPENAI_FREE
        value: "true"
      - key: OPENAI_MAX_RPM
        value: "10"
      - key: EMBEDDING_PROVIDER # local ONNX model (~150 MB): no embedding API quota to run out of
        value: fastembed
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: EMBEDDING_DIM
        value: "384"
      - key: EMBEDDING_BATCH_SIZE
        value: "16"
      - key: EMBEDDING_RESET_ON_MISMATCH
        value: "true"
      - key: GIT_CLONE_FILTER # full history, file contents on demand: light on a 0.1-CPU instance
        value: blob:none
      - key: MCP_TRANSPORT
        value: inmemory
      - key: DEMO_MODE
        value: "true"
      - key: AUTO_INGEST_REPO
        value: psf/requests@v2.32.3,sindresorhus/ky@v2.2.0
      - key: MAX_SUBQUESTIONS
        value: "3"
      - key: MAX_RETRIES
        value: "1"
      - key: DATA_DIR
        value: /tmp/badebhai
      - key: LOG_JSON
        value: "true"
